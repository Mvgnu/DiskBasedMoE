name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU reference and tools
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[runtime,serve,dev]'
      - name: Source and ownership checks
        run: |
          python -m ruff check src scripts tests server.py export_glm4_moe_lite_backbone.py
          python scripts/check_architecture.py
      - name: Complete tests
        run: python -m pytest -q
      - name: Package artifacts
        run: python -m build --no-isolation
      - name: Planner smoke
        run: disk-moe-plan --scenario examples/kimi-k2-q4-scenario.json
